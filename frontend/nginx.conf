server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/restaurants { proxy_pass http://restaurant-api:3001; }
  location /api/orders { proxy_pass http://orders-api:3002; }
  location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
}
